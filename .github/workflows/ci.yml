name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend, audit and mobile workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Mixed-version storage/recovery checks read exact previous releases.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate workflow syntax and expressions
        run: python .github/scripts/check_workflows.py
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Audit all dependency severities
        run: npm audit --audit-level=low
      - name: Install Python runtime and test dependencies
        run: python -m pip install -r requirements.txt -r .github/requirements-test.txt
      - name: Check Python dependency compatibility
        run: python -m pip check
      - name: Install the locked Playwright Chromium and system libraries
        run: npx --no-install playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Build and run the complete disposable mobile gate
        run: python .github/scripts/run_local_checks.py mobile
      - name: Check Worker history at growing local data volumes
        run: node scripts/report-history-volume-test.mjs --output output/ci/history-volume.json
      - name: Retain aggregate growth evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-growth-evidence
          path: output/ci/*.json
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Backend boundaries and native PostgreSQL volume
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install Python runtime and test dependencies
        run: python -m pip install -r requirements.txt -r .github/requirements-test.txt
      - name: Check Python dependency compatibility
        run: python -m pip check
      - name: Run disposable backend regression suites
        run: python .github/scripts/run_local_checks.py backend
      - name: Install PostgreSQL 17 from its official signed apt repository
        # Ubuntu 24.04 runners currently contain PostgreSQL 16; do not assume 17 exists.
        # https://www.postgresql.org/download/linux/ubuntu/
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-17
          /usr/lib/postgresql/17/bin/postgres --version
      - name: Verify native PostgreSQL environment isolation
        run: python backend/postgres_rehearsal_environment_test.py --pg-bin /usr/lib/postgresql/17/bin --output output/ci/postgres-environment.json
      - name: Check small native PostgreSQL volume with a new owned local cluster
        run: python backend/report_volume_test.py --pg-bin /usr/lib/postgresql/17/bin --profile ci --output output/ci/backend-volume.json
      - name: Retain aggregate growth evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-growth-evidence
          path: output/ci/*.json
          if-no-files-found: ignore
          retention-days: 7
